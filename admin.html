<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin — Gran Rifa</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1217;--side:#11161D;--card:#151B23;--line:#232D38;--text:#E8EDF2;--mut:#8A97A6;--soft:#A9B4C2;--blue:#4C8DFF;--green:#34D399;--amber:#F5B73D;--red:#F0657A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:14px;min-height:100vh}
button{font-family:inherit;cursor:pointer}
svg{flex:none}
[hidden]{display:none!important}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px 32px;text-align:center}
.lbox .lg{width:46px;height:46px;border-radius:14px;background:var(--blue);color:#0E1217;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.lbox h1{font-size:20px;font-weight:800;margin-bottom:22px}
.lbox input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 14px;font:inherit;outline:none;margin-bottom:12px}
.lbox input:focus{border-color:var(--blue)}
.lbox button{width:100%;height:46px;border:none;border-radius:12px;background:var(--blue);color:#0E1217;font-weight:800;font-size:14px}
#lerr{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
/* layout */
#app{display:flex;flex-wrap:wrap;min-height:100vh}
aside{flex:0 0 244px;width:244px;background:var(--side);border-right:1px solid #1E2732;padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .2s,flex-basis .2s}
aside.c{flex-basis:84px;width:84px}
aside.c .lb{display:none}
.brand{display:flex;align-items:center;gap:10px;height:40px;font-weight:800;font-size:17px}
.brand i{width:36px;height:36px;border-radius:11px;background:var(--blue);color:#0E1217;display:flex;align-items:center;justify-content:center}
nav{display:flex;flex-direction:column;gap:4px;margin-top:28px}
.nv{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;border:none;background:none;color:var(--soft);font-size:14px;font-weight:600;white-space:nowrap;width:100%;text-align:left}
.nv:hover{background:#1A222C;color:#fff}
.nv.on{background:#1B2A44;color:#9CC0FF}
.nv.out{color:var(--red)}
.bot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.main{flex:999 1 560px;min-width:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:18px 32px;border-bottom:1px solid #1E2732}
.sr{flex:1 1 300px;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 16px;height:46px}
.sr input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font:inherit}
.sr input::placeholder{color:var(--mut)}
.hr{margin-left:auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.bt{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:600}
.bt:hover{background:#222C38}
.bt.sq{width:44px;padding:0;justify-content:center;position:relative}
.dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--card)}
.prof{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;border-radius:14px;background:var(--card);border:1px solid var(--line);height:44px}
.prof b{width:34px;height:34px;border-radius:10px;background:#24324A;color:#9CC0FF;font-size:13px;display:flex;align-items:center;justify-content:center}
.prof div{line-height:1.2;font-size:13px;font-weight:700}.prof small{display:block;font-size:11px;color:var(--mut);font-weight:400}
main{padding:28px 32px 40px;display:flex;flex-direction:column;gap:24px}
h1.t{font-size:26px;font-weight:800;letter-spacing:-.5px}
.sub{color:var(--mut);margin-top:6px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.k{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.k .h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--soft)}
.k .v{font-size:40px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:6px}
.k small{display:block;margin-top:8px;font-size:12px;color:var(--mut)}
.two{display:flex;flex-wrap:wrap;gap:16px}
.fin{flex:1 1 100%;background:linear-gradient(135deg,#0F2A24,#12201E);border:1px solid #1F4A3F;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px}
.fin .big{font-size:46px;font-weight:800;letter-spacing:-2px;color:var(--green);line-height:1}
.fin .r{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:#B7D9CC;font-weight:600}.fin .r b{color:var(--text)}
.fin .bar{background:#1B3B33}
.fsplit{flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.tbl{flex:1 1 100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 20px 8px;display:flex;flex-direction:column;gap:16px}
.th{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.th h2{font-size:17px;font-weight:700}
.sc{overflow-x:auto}
.g{display:grid;grid-template-columns:minmax(140px,1.2fr) 120px minmax(180px,1.5fr) minmax(150px,1fr) minmax(130px,1fr) 96px 116px 104px 92px 176px;gap:12px;align-items:center;padding:12px;min-width:1340px}
.g.hd{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--line);padding-top:10px;padding-bottom:10px}
.g.rw{border-bottom:1px solid #1B232D;border-radius:10px}.g.rw:hover{background:#1A222C}
.tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mt{font-size:12px;font-weight:700;color:#F0B90B;background:#2B2410;padding:4px 10px;border-radius:999px;white-space:nowrap;justify-self:start}
.tk{display:flex;flex-wrap:wrap;gap:6px}.tk span{font-size:12px;font-weight:700;color:#9CC0FF;background:#1B2A44;padding:4px 9px;border-radius:8px}
.ac{display:flex;gap:6px}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#1A222C;color:var(--soft);display:flex;align-items:center;justify-content:center}
.ic:hover{background:#26313F;color:#fff}
.ic.ok{background:#12392F;border-color:#1F4A3F;color:var(--green)}.ic.no{color:var(--amber)}.ic.del{background:#2A171C;border-color:#3A2229;color:var(--red)}
.empty{padding:40px 12px;text-align:center;color:var(--mut)}
/* historial de pagos (dashboard) */
.hist{flex:1 1 100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px 20px 10px;display:flex;flex-direction:column;gap:14px}
.hh{display:flex;align-items:center;gap:12px}
.hh i{width:40px;height:40px;border-radius:12px;background:#1B2A44;color:#9CC0FF;display:flex;align-items:center;justify-content:center}
.hh b{display:block;font-size:17px;font-weight:700}.hh small{color:var(--mut);font-size:12px}
.g.g5{grid-template-columns:minmax(170px,2fr) 120px 96px 130px 120px;min-width:660px}
.g.g5.hd{background:#1A222C;border-radius:10px;border-bottom:none}
.st{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}.st i{width:8px;height:8px;border-radius:50%}
/* modal */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.mb{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;max-width:540px;width:100%;max-height:90vh;overflow-y:auto}
.mb h2{font-size:19px;font-weight:800;margin-bottom:18px}
.f{margin-bottom:12px}.f label{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.mb img{width:100%;max-height:380px;object-fit:contain;border-radius:12px;border:1px solid var(--line);margin-top:6px;cursor:zoom-in}
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out}
#lb img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:10px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--green);border-radius:12px;padding:14px 18px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;z-index:200;pointer-events:none;max-width:320px}
#toast.show{opacity:1;transform:none}#toast.err{border-left-color:var(--red)}
@media(max-width:800px){aside{flex-basis:84px;width:84px}aside .lb{display:none}header,main{padding-left:16px;padding-right:16px}}

/* detalle: pestañas + factura web */
.tabs{display:flex;gap:6px;margin-bottom:16px;background:var(--bg);padding:4px;border-radius:12px}
.tabs button{flex:1;height:38px;border:none;border-radius:9px;background:none;color:var(--soft);font-weight:700;font-size:13px}
.tabs button.on{background:#1B2A44;color:#9CC0FF}
.fac{background:#FBF6EA;color:#1d1a16;border-radius:16px;overflow:hidden}
.fh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;background:#0F3B2E;border-bottom:4px solid #D9A441;color:#FBF6EA}
.fh h3{font-size:24px;font-weight:800;letter-spacing:1px}.fh small{opacity:.85;font-size:12px;color:#E9D9A8;font-weight:700}
.fn{text-align:right;font-weight:800;font-size:13px;word-break:break-all}.fn small{display:block}
.fb{padding:8px 20px 18px}
.fr{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed #D8CBB0;font-size:13px}
.fr span{color:#6b6254;font-weight:600}.fr b{text-align:right;word-break:break-word}
.fr .nm{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}.fr .nm i{font-style:normal;background:#B3202F;color:#FBF6EA;border-radius:999px;padding:2px 10px;font-size:12px}
.ft{display:flex;justify-content:space-between;align-items:center;background:#E4EFE6;border:1px solid #BFD6C6;border-radius:12px;padding:14px 16px;margin-top:14px;font-weight:800}
.ft b{font-size:22px;color:#0F3B2E}
.fg{text-align:center;font-size:12px;color:#6b6254;margin-top:14px}

/* metas + gráfico por día */
.fin .r em{font-style:normal;color:#7FAE9C;font-weight:600}
.mp{font-size:11px;color:#8FB8A8;margin-top:6px}
.dias{flex:1 1 100%;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.dh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px;gap:2px}
.seg button{border:none;background:none;color:var(--soft);font-weight:700;font-size:12px;padding:8px 16px;border-radius:999px}
.seg button.on{background:var(--green);color:#0E1217}
.leg{display:flex;gap:18px;font-size:12px;color:var(--soft);font-weight:600}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.plot{position:relative;height:220px;margin-left:48px;margin-top:22px}
.gl{position:absolute;left:0;right:0;border-top:1px dashed #232D38}
.gl span{position:absolute;left:-48px;top:-8px;width:40px;text-align:right;font-size:11px;color:var(--mut)}
.cols{position:absolute;inset:0;display:flex;align-items:flex-end;gap:6px}
.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative;cursor:pointer;min-width:0}
.cb{width:72%;max-width:48px;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-height:0;transition:height .25s}
.cb b{display:block;width:100%}
.s-pag{background:linear-gradient(180deg,rgba(52,211,153,.55),rgba(52,211,153,.10))}
.s-pen{background:linear-gradient(180deg,rgba(245,183,61,.45),rgba(245,183,61,.10))}
.col.on .s-pag{background:linear-gradient(180deg,#34D399,#0F7A57)}.col.on .s-pen{background:#F5B73D}.col.on .cb{box-shadow:0 0 0 1px rgba(52,211,153,.35)}
.pt{position:absolute;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:#34D399;border:2px solid #fff;z-index:1}
.col:hover .cb{filter:brightness(1.25)}
.tip{position:absolute;background:#F1F5F9;color:#0E1217;border-radius:12px;padding:8px 12px;font-size:11px;line-height:1.5;white-space:nowrap;z-index:3;box-shadow:0 6px 18px rgba(0,0,0,.45)}.tip div{display:flex;justify-content:space-between;gap:14px;color:#566272}.tip div b{color:#0E1217;font-size:12px}
.xl{display:flex;gap:6px;margin:8px 0 0 48px}
.xl span{flex:1;text-align:center;font-size:11px;color:var(--mut);min-width:0;white-space:nowrap}
.xl span.on{color:var(--green);font-weight:700}
.dd{font-size:13px;color:var(--soft);margin-left:48px}.dd b{color:var(--text)}

/* configuración */
.ctabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.ctabs button{background:none;border:none;color:var(--mut);font-weight:700;font-size:14px;padding:12px 18px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ctabs button:hover{color:#fff}.ctabs button.on{color:var(--green);border-bottom-color:var(--green)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start;margin-top:22px}
.ccol{display:flex;flex-direction:column;gap:16px;min-width:0}
.cc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:18px;min-width:0}
.cch{display:flex;align-items:flex-start;gap:12px}
.cch i{width:40px;height:40px;border-radius:12px;background:#1B2A44;color:#9CC0FF;display:flex;align-items:center;justify-content:center;flex:none}
.cch b{display:block;font-size:16px;font-weight:700}.cch small{display:block;color:var(--mut);font-size:12px;line-height:1.5;margin-top:2px}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin-bottom:6px}
.fld input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 14px;font:inherit;outline:none;transition:border-color .15s,box-shadow .15s}
.fld input::placeholder{color:#566272}
.fld input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.fld small{display:block;margin-top:6px;font-size:12px;color:var(--mut)}
.drop{border:1.5px dashed #2C3A4A;border-radius:14px;background:var(--bg);padding:16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.qr{width:112px;height:112px;border-radius:12px;background:#fff;object-fit:contain;border:1px solid var(--line);flex:none;cursor:zoom-in}
.qr0{background:#151B23;color:#566272;display:flex;align-items:center;justify-content:center;cursor:default;border:1px dashed #2C3A4A}
.btn2{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:none;background:#E8EDF2;color:#0E1217;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.btn2:hover{background:#fff}
.bgh{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--soft);font-weight:700;font-size:13px}
.bgh:hover:not(:disabled){background:#1A222C;color:#fff}.bgh:disabled{opacity:.4;cursor:default}.bgh.del{color:var(--red);border-color:#3A2229}
.segc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.segc button{height:54px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--soft);font-weight:700;font-size:14px;line-height:1.2}
.segc button:hover{border-color:#34445A}.segc button.on{border-color:var(--green);background:#12392F;color:var(--green)}
.sbar{position:sticky;bottom:16px;margin-top:22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:rgba(21,27,35,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;padding:12px 16px;z-index:5}
.st2{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:8px}.st2::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green)}.st2.d{color:var(--amber)}.st2.d::before{background:var(--amber)}
.bsave{height:46px;padding:0 24px;border:none;border-radius:12px;background:var(--green);color:#0E1217;font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px}
.bsave:hover:not(:disabled){filter:brightness(1.08)}.bsave:disabled{opacity:.35;cursor:default}
.soon{align-items:center;text-align:center;padding:56px 22px;margin-top:22px;gap:10px}.soon small{color:var(--mut);max-width:380px;line-height:1.5}

/* configuración v2 */
.fld textarea{width:100%;min-height:92px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:12px 14px;font:inherit;outline:none;resize:vertical;transition:border-color .15s,box-shadow .15s}
.fld textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(52,211,153,.15)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.clr{display:flex;flex-direction:column;gap:6px}
.clr input{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px;cursor:pointer}
.clr b{font-size:13px;display:block}.clr span{font-size:11px;color:var(--mut);text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:42px;min-width:64px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--soft);font-weight:800}
.chips button.on{border-color:var(--green);background:#12392F;color:var(--green)}
.sw{margin-left:auto;width:42px;height:24px;border-radius:999px;border:none;background:#2C3A4A;position:relative;flex:none;transition:.15s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--green)}.sw.on::after{left:21px}
.segc button small{display:block;font-size:11px;font-weight:500;color:var(--mut);margin-top:2px}.segc button.on small{color:inherit;opacity:.8}
.hint{color:var(--mut);font-size:12px;line-height:1.5}

.pal{display:flex;flex-wrap:wrap;gap:12px 16px}
.pi{display:flex;flex-direction:column;align-items:center;gap:7px;width:58px}
.pi small{font-size:11px;color:var(--mut);font-weight:600}.pi.on small{color:var(--text)}
.pi button{width:44px;height:44px;border-radius:50%;background:var(--c);border:1px solid #34445A;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.pi button:hover{transform:scale(1.08)}
.pi button.on{border-color:transparent;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c)}
.pv{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px}
.pv button{height:42px;padding:0 22px;border:none;border-radius:12px;font-weight:800;font-size:14px}

/* métodos de pago dinámicos */
.pg{display:flex;flex-direction:column;gap:16px;margin-top:22px}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.ph h3{font-size:17px;font-weight:700}.ph small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.badd{height:46px;padding:0 20px;border:none;border-radius:12px;background:var(--green);color:#0E1217;font-weight:800;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.badd:hover{filter:brightness(1.08)}
.mlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzOO80RB9FkO-pDj3JmEV6q9dxIH42odoJetED9dWyqyAmdiaIoCGKgyndZVJ-csu-g/exec';
let KEY = '';
const fmt = n => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');   // 25000 -> 25.000
const PRECIO = new Proxy({}, { get: (_, k) => { try { const m = conf.nums.mods[k]; if (m && Number(m.precio) > 0) return Number(m.precio); } catch (e) {} return { x1: 25000, x3: 50000 }[k] || 0; } });
const modsActivas = () => { try { return Object.entries(conf.nums.mods).filter(([, m]) => m.on).map(([k]) => k); } catch (e) { return ['x1', 'x3']; } };
const cif = k => +conf.nums.mods[k].cifras === 2 ? 2 : 3;   // 2 = 00–99 · 3 = 000–999
const rangoDe = k => '0'.repeat(cif(k)) + '–' + '9'.repeat(cif(k));
// x1 = 1 número por boleto (todo el rango). xN = TALONARIO de N números: floor((rango-1)/N) boletos (x3 con 3 cifras = 333). Igual que index.html
const nBol = k => { const n = +k.slice(1), R = Math.pow(10, cif(k)); return n <= 1 ? R : Math.floor((R - 1) / n); };
const metaDe = k => nBol(k) * (Number(conf.nums.mods[k].precio) || 0);
const subMod = k => { const n = +k.slice(1); return n === 1 ? `1 número por boleto · ${usd(PRECIO[k])} · ${nBol(k)} boletos · Rango ${rangoDe(k)}` : `Talonario de ${n} números · ${usd(PRECIO[k])} · ${fmt(nBol(k))} talonarios · Rango ${rangoDe(k)}`; };
</script>

<script>
const P = {
  grid:'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z',
  tick:'M2 9a3 3 0 0 1 0 6v2a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1v-2a3 3 0 0 1 0-6V7a1 1 0 0 0-1-1H3a1 1 0 0 0-1 1z M13 5v2 M13 11v2 M13 17v2',
  layers:'M12 2 2 7l10 5 10-5z M2 17l10 5 10-5 M2 12l10 5 10-5',
  users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M22 21v-2a4 4 0 0 0-3-3.9 M16 3.1a4 4 0 0 1 0 7.8',
  chart:'M3 3v18h18 M7 15l4-4 3 3 5-6',
  set:'M4 21v-7 M4 10V3 M12 21v-9 M12 8V3 M20 21v-5 M20 12V3 M1 14h6 M9 8h6 M17 16h6',
  out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9',
  menu:'M3 6h18 M3 12h18 M3 18h18',
  search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16z M21 21l-4.3-4.3',
  refresh:'M21 12a9 9 0 1 1-3-6.7 M21 3v6h-6',
  down:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3',
  bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9 M13.7 21a2 2 0 0 1-3.4 0',
  eye:'M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
  check:'M20 6 9 17l-5-5',
  x:'M18 6 6 18 M6 6l12 12',
  undo:'M3 7v6h6 M3 13a9 9 0 1 0 3-7.7L3 8',
  trash:'M3 6h18 M8 6V4h8v2 M19 6l-1 14H6L5 6 M10 11v6 M14 11v6',
  upload:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12',
  clock:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 6v6l4 2',
  chat:'M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z',
  qr:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h3v3h-3z M20 14v3 M14 20h3 M20 20h1',
  save:'M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z M17 21v-8H7v8 M7 3v5h8',
  plus:'M12 5v14 M5 12h14',
  bank:'M3 21h18 M5 21V10 M9 21V10 M15 21V10 M19 21V10 M12 3l9 5H3z',
  coin:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M9 9h5a2 2 0 0 1 0 4H9 M9 13h5.5a2 2 0 0 1 0 4H9 M12 7v2 M12 17v2',
  mail:'M3 5h18v14H3z M3 7l9 6 9-6',
  globe:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M2 12h20 M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20'
};
const ic = (n, s) => `<svg width="${s||18}" height="${s||18}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;

let registros = [], q = '', active = 'dash';

// ── utilidades ──
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const mon = () => 'COP';
const sym = () => '$';
const usd = n => sym() + fmt(n) + ' ' + mon();
const totR = r => Number(r.total) > 0 ? Number(r.total) : PRECIO[parte(r)];
const nums = r => Array.isArray(r.nums) ? r.nums.map(String) : String(r.nums == null ? '' : r.nums).split(',').map(t => t.trim()).filter(Boolean);
const parte = r => 'x' + Math.max(1, nums(r).length);
const esElim = r => /^eliminado/i.test(String(r.estado || ''));
const estado = r => { const e = String(r.estado || 'pendiente').toLowerCase(); return e.startsWith('eliminado') ? 'Eliminado' : e === 'publicado' ? 'Pagado' : e === 'rechazado' ? 'Rechazado' : 'Pendiente'; };
const COL = { Eliminado:['#232D38','#8A97A6'], Pagado:['#12392F','#34D399'], Pendiente:['#3A2F14','#F5B73D'], Rechazado:['#3A1B22','#F0657A'] };
const $ = id => document.getElementById(id);
function fechaHora(r) {
  const f = String(r.fecha || ''); let d = new Date(f);
  if (f && !isNaN(d) && /\d{4}-\d{2}-\d{2}|T\d{2}:/.test(f))
    return { ts: +d, dia: d.toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'}), hora: /T\d{2}:|\d{2}:\d{2}/.test(f) ? d.toLocaleTimeString('es-CO', {hour:'numeric', minute:'2-digit'}) : '—' };
  const m = f.match(/(\d{1,2}\/\d{1,2}\/\d{4}),?\s*(\d{1,2}:\d{2})(?::\d{2})?\s*([ap]\.?\s?m\.?)?/i);
  if (m) return { ts: Number(r.id) || 0, dia: m[1], hora: m[2] + (m[3] ? ' ' + m[3].replace(/[.\s]/g, '').toUpperCase() : '') };
  return { ts: Number(r.id) || 0, dia: f ? f.slice(0, 10) : '—', hora: '—' };
}
function toast(m, err) { const t = $('toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : ''); clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3000); }
function toThumb(url) {
  if (!url || url.includes('thumbnail?id=')) return url;
  const m = url.match(/\/d\/([\w-]+)/) || url.match(/[?&]id=([\w-]+)/) || url.match(/googleusercontent\.com\/d\/([\w-]+)/);
  return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1000' : url;
}

// ── login / sesión ──
async function login() {
  const k = $('pass').value.trim(); if (!k) { $('lerr').textContent = 'Escribe la contraseña.'; return; }
  const btn = document.querySelector('.lbox button'); if (btn) btn.disabled = true;
  $('lerr').style.color = ''; $('lerr').textContent = 'Verificando…';
  const fallo = m => { $('lerr').textContent = m; };
  try {
    let res, txt, json;
    try { res = await fetch(SCRIPT_URL + '?action=list&key=' + encodeURIComponent(k), { redirect: 'follow', cache: 'no-store' }); txt = await res.text(); }
    catch (e) { return fallo('No hay conexión con el servidor (Apps Script). Revisa internet y que la implementación sea "Cualquier persona".'); }
    try { json = JSON.parse(txt); }
    catch (e) { return fallo('El servidor no devolvió datos válidos. En Apps Script: ejecuta autorizar() una vez, y luego Implementar > Administrar implementaciones > Nueva versión, con acceso "Cualquier persona".'); }
    if (!json.ok) return fallo(json.error === 'No autorizado' ? 'Contraseña incorrecta.' : 'Error del script: ' + json.error);
    if (!json.admin) {
      $('pass').value = '';
      return fallo(json.v ? 'Contraseña incorrecta. Debe ser igual a ADMIN_KEY en Código.gs.' : 'Contraseña rechazada: el script publicado está DESACTUALIZADO o tiene otra clave. Pega el nuevo Código.gs, guarda y usa Implementar > Administrar implementaciones > lápiz > Nueva versión.');
    }
    KEY = k; registros = json.data || [];
    $('lerr').textContent = ''; $('login').hidden = true; $('app').hidden = false;
    try { render(); toast('Registros cargados correctamente'); } catch (e) { console.error(e); toast('Sesión iniciada, pero hubo un error al dibujar: ' + e.message, true); }
    pullConfig();
  } catch (e) { fallo('Error inesperado: ' + e.message); }
  finally { if (btn) btn.disabled = false; }
}
function salir() { KEY = ''; $('app').hidden = true; $('login').hidden = false; $('pass').value = ''; registros = []; }
function toggleSide() { $('side').classList.toggle('c'); }

// ── menú ──
const NAV = () => [['dash', 'Inicio', 'grid'], ...modsActivas().map(k => [k, 'Boletos ' + k, 'tick']), ['inv', 'Invitaciones', 'users'], ['fin', 'Finanzas', 'chart'], ['elim', 'Eliminados', 'trash'], ['cfg', 'Configuración', 'set']];
const metNom = r => r.metodo === 'nubank' ? 'Nu / Bre-B' : ((PLAT[r.metodo] || {}).n || r.metodo || 'Binance Pay');
function drawNav() {
  const nE = registros.filter(esElim).length;
  $('nav').innerHTML = NAV().map(([k, l, i]) => `<button class="nv${active === k ? ' on' : ''}" onclick="go('${k}')" title="${l}">${ic(i, 20)}<span class="lb">${l}${k === 'elim' && nE ? ` <b class="nb">${nE}</b>` : ''}</span></button>`).join('');
}
function go(k) {
  active = k; drawNav(); render(); window.scrollTo({top:0, behavior:'smooth'});
}
function setQ(v) { q = v.trim().toLowerCase(); render(); }

// ── datos (Apps Script) ──
async function cargar() {
  $('rows').innerHTML = '<div class="empty">Cargando registros…</div>';
  try {
    const res = await fetch(SCRIPT_URL + '?action=list&key=' + encodeURIComponent(KEY), { redirect: 'follow', cache: 'no-store' });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'Error desconocido');
    registros = json.data || [];
    render(); toast('Registros cargados correctamente');
  } catch (e) {
    $('rows').innerHTML = '<div class="empty">⚠️ Error al cargar: ' + esc(e.message) + '</div>';
    toast('Error: ' + e.message, true);
  }
}
async function apiEstado(id, est) {
  const res = await fetch(SCRIPT_URL + '?action=status&id=' + encodeURIComponent(id) + '&estado=' + encodeURIComponent(est) + '&key=' + encodeURIComponent(KEY), { redirect: 'follow', cache: 'no-store' });
  const json = await res.json(); if (json.ok === false) throw new Error(json.error || 'No se pudo actualizar');
  const r = registros.find(x => String(x.id) === String(id)); if (r) r.estado = est;
  return json;
}
async function apiBorrar(id) {
  const res = await fetch(SCRIPT_URL + '?action=delete&id=' + encodeURIComponent(id) + '&key=' + encodeURIComponent(KEY), { redirect: 'follow', cache: 'no-store' });
  const json = await res.json(); if (json.ok === false) throw new Error(json.error || 'No se pudo borrar');
  registros = registros.filter(x => String(x.id) !== String(id));
}
async function setEstado(id, est, msg) {
  const r = registros.find(x => String(x.id) === String(id));
  let j;
  try { j = await apiEstado(id, est); render(); }
  catch (e) { return toast('Error: ' + e.message, true); }
  if (est === 'publicado' && !msg) {
    const c = String((j && j.correo) || '');
    if (c === 'enviado') toast('Pago aprobado y correo enviado a ' + (r ? r.correo : 'el cliente'));
    else if (c.indexOf('error') === 0) toast('Pago aprobado, pero el correo falló (' + c.slice(7) + ')', true);

function subirQR(inp) {
  const f = inp.files && inp.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)) return toast('Elige un archivo de imagen (PNG o JPG)', true);
  if (f.size > 8 * 1024 * 1024) return toast('La imagen pesa más de 8 MB', true);
  const rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, 480 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      pdraft.qr = c.toDataURL('image/png'); drawCfg();
    };
    im.onerror = () => toast('No se pudo leer la imagen', true);
    im.src = rd.result;
  };
  rd.readAsDataURL(f);
}

    await new Promise(r => setTimeout(r, w));
    try { const j = await (await fetch(SCRIPT_URL + '?action=getconfig&key=' + encodeURIComponent(KEY), { redirect: 'follow', cache: 'no-store' })).json(); if (j.ok && j.data && j.data.savedAt === at) return true; } catch (e) {}

      `<section class="cc"><div class="cch"><i>${ic('tick', 20)}</i><div><b>Correo de Confirmación al Cliente (Al publicar)</b><small>Correo corto que se le enviará al cliente únicamente cuando hagas clic en “Aprobar / Publicar” su pago.</small></div>
        <button class="sw ${conf.mail.cliente.on ? 'on' : ''}" role="switch" aria-checked="${conf.mail.cliente.on}" aria-label="Activar confirmación al cliente" onclick="cfgSet('mail.cliente.on',${!conf.mail.cliente.on})"></button></div>
        ${fl('Asunto del correo', 'mail.cliente.asunto', '¡Tu número [NUMERO] ha sido confirmado!')}
        <div class="fld"><label for="m-msg">Mensaje de confirmación</label><textarea id="m-msg" oninput="cfgIn('mail.cliente.msg',this.value)">${esc(conf.mail.cliente.msg)}</textarea><small>Puedes usar [NOMBRE], [NUMERO] y [TOTAL].</small></div></section>`
  };
  $('cfgv').innerHTML = `<div class="ctabs">${tabs.map(([k, l]) => `<button class="${ctab === k ? 'on' : ''}" onclick="setTab('${k}')">${l}</button>`).join('')}</div>
    <div class="${ctab === 'pago' ? 'pg' : 'cgrid'}">${B[ctab]}</div>
    ${ctab === 'pago' ? '' : `<div class="sbar"><span class="st2" id="sb-s"></span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="bgh" id="sb-d" onclick="descartarCfg()">Descartar</button><button class="bsave" id="sb-g" onclick="guardarCfg()">${ic('save', 18)}${ctab === 'mail' ? 'Guardar ajustes de avisos' : ctab === 'web' ? 'Guardar cambios en el Sitio Web' : 'Guardar cambios'}</button></div></div>`}`;
  confBar();
}
document.addEventListener('click', ev => {
  const b = ev.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id, a = b.dataset.a;
  if (a === 'ver') verDetalle(id); else if (a === 'ok') setEstado(id, 'publicado');
  else if (a === 'no') setEstado(id, 'rechazado'); else if (a === 'del') borrar(id); else if (a === 'rest') restaurar(id); else if (a === 'purge') purgar(id);
});

// ── detalle / comprobante ──
function verDetalle(id) {
  const r = registros.find(x => String(x.id) === String(id)); if (!r) return;
  const c = r.comprobante || '', e = estado(r), pr = parte(r), fh = fechaHora(r), gpr = conf.sitio.premios.find(p => p.mod === pr && p.valor);
  const src = !c ? '' : (c.startsWith('data:') ? c : (c.startsWith('http') ? toThumb(c) : (c.startsWith('/9j') || c.length > 500 ? 'data:image/jpeg;base64,' + c : '')));
  const comp = src ? `<img src="${esc(src)}" alt="Comprobante de pago" onclick="$('lb-i').src=this.src;$('lb').style.display='flex'">` : (c ? `<p style="color:var(--mut)">${esc(c)}</p>` : '<p style="color:var(--mut);padding:24px 0;text-align:center">No subió comprobante de pago</p>');
  const fr = (l, v) => `<div class="fr"><span>${l}</span><b>${v}</b></div>`;
  const chips = nums(r).map(n => `<i>${esc(n)}</i>`).join('') || '—';
  const fac = `<div class="fac">
    <div class="fh"><div><h3>FACTURA</h3><small>🎄 ${esc(conf.sitio.nombre || 'Gran Rifa')}</small></div><div class="fn"><small>N°</small>${esc(r.id)}</div></div>
    <div class="fb">${fr('Nombre', esc(r.nombre))}${fr('Celular', esc(r.pais || '—'))}${fr('Correo', esc(r.correo))}${fr('Invitó / cómo conoció', esc(r.invito || '—'))}
      ${fr('Rifa', pr === 'x1' ? 'x1 · 1 número' : 'Talonario ' + pr + ' · ' + pr.slice(1) + ' números')}${gpr ? fr('Gran premio', esc(gpr.valor)) : ''}
      ${fr('Números', `<span class="nm">${chips}</span>`)}${fr('Método', esc(metNom(r)))}${fr('Fecha', esc(fh.dia + (fh.hora !== '—' ? ' · ' + fh.hora : '')))}
      <div class="ft"><span>Total pagado</span><b>${usd(totR(r))}</b></div>
      <p class="fg">¡Gracias por participar! 🎄🎁</p></div></div>`;
  $('m-t').textContent = (r.nombre || '') + ' ';
  $('m-t').innerHTML = esc(r.nombre || '') + ` <span class="pill" style="background:${COL[e][0]};color:${COL[e][1]};vertical-align:middle;margin-left:6px">${e}</span>`;
  $('m-b').innerHTML = `<div class="tabs"><button id="tb-c" class="on" onclick="tabDet('c')">Comprobante de pago</button><button id="tb-f" onclick="tabDet('f')">Factura web</button></div>
    <div id="tp-c">${comp}</div><div id="tp-f" hidden>${fac}</div>`;
  $('modal').classList.add('on');
}
function tabDet(k) {
  $('tp-c').hidden = k !== 'c'; $('tp-f').hidden = k !== 'f';
  $('tb-c').classList.toggle('on', k === 'c'); $('tb-f').classList.toggle('on', k === 'f');
}
function cerrar() { $('modal').classList.remove('on'); }
function avisos() { const n = registros.filter(r => estado(r) === 'Pendiente').length; toast(n ? n + ' registro(s) pendientes por aprobar' : 'No hay registros pendientes'); }

// ── CSV ──
// ── CSV con selección ──
let exp = null;
function csv() {
  const act = registros.filter(r => !esElim(r)); if (!act.length) return toast('No hay registros para exportar', true);
  const ks = [...new Set([...modsActivas(), ...act.map(parte)])].filter(k => conf.nums.mods[k]).sort();
  exp = { ks, sel: Object.fromEntries(ks.map(k => [k, true])), res: true, par: true };
  drawExp(); $('modal').classList.add('on');
}
function expSet(k, v) { if (k === '_res') exp.res = v; else if (k === '_par') exp.par = v; else exp.sel[k] = v; drawExp(); }
function expTodo(v) { exp.ks.forEach(k => exp.sel[k] = v); drawExp(); }
function drawExp() {
  const act = registros.filter(r => !esElim(r)), cnt = k => act.filter(r => parte(r) === k).length;
  const row = (t, d, on, k) => `<label class="xr"><input type="checkbox" ${on ? 'checked' : ''} onchange="expSet('${k}',this.checked)"><span><b>${t}</b><small>${d}</small></span></label>`;
  const n = exp.ks.filter(k => exp.sel[k]).length + (exp.res ? 1 : 0) + (exp.par ? 1 : 0);
  $('m-t').textContent = 'Exportar CSV';
  $('m-b').innerHTML = `<div class="xh">Listas de boletos<span><a onclick="expTodo(true)">Todas</a> · <a onclick="expTodo(false)">Ninguna</a></span></div>
    ${exp.ks.map(k => row('Boletos ' + k, cnt(k) + (cnt(k) === 1 ? ' registro' : ' registros') + ' · ' + usd(PRECIO[k]), exp.sel[k], k)).join('')}
    <div class="xh">Totales</div>
    ${row('Resumen general', 'Total cobrado, por aprobar, estados y meta total', exp.res, '_res')}
    ${row('Totales por modalidad', 'Cobrado, registros y meta de cada boleto (' + exp.ks.join(', ') + ')', exp.par, '_par')}
    <button class="bsave" style="width:100%;justify-content:center;margin-top:14px" onclick="csvDescargar()" ${n ? '' : 'disabled'}>${ic('down', 18)}Descargar CSV</button>`;
}
function buildCSV() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"', ln = a => a.map(q).join(',');
  const act = registros.filter(r => !esElim(r)), mn = mon(), P = r => totR(r);
  const suma = (rs, e) => rs.filter(r => estado(r) === e).reduce((a, r) => a + P(r), 0), nEs = (rs, e) => rs.filter(r => estado(r) === e).length;
  const pct = (v, m) => m ? (v / m * 100).toFixed(1).replace('.0', '') + '%' : '—';
  const out = [];
  if (exp.res) {
    const meta = exp.ks.reduce((a, k) => a + metaDe(k), 0), cob = suma(act, 'Pagado');
    out.push([['RESUMEN GENERAL'], ['Fecha de exportación', new Date().toLocaleString('es-CO')], ['Moneda', mn], ['Total registros', act.length], ['Pagados', nEs(act, 'Pagado')], ['Pendientes', nEs(act, 'Pendiente')], ['Rechazados', nEs(act, 'Rechazado')],
      ['Total cobrado', cob], ['Por aprobar', suma(act, 'Pendiente')], ['Meta total', meta], ['% de la meta', pct(cob, meta)]]);
  }
  if (exp.par) out.push([['TOTALES POR MODALIDAD'], ['Modalidad', 'Precio', 'Registros', 'Pagados', 'Pendientes', 'Rechazados', 'Cobrado', 'Por aprobar', 'Meta', '% de la meta'],
    ...exp.ks.map(k => { const rs = act.filter(r => parte(r) === k), c = suma(rs, 'Pagado'); return ['Boletos ' + k, PRECIO[k], rs.length, nEs(rs, 'Pagado'), nEs(rs, 'Pendiente'), nEs(rs, 'Rechazado'), c, suma(rs, 'Pendiente'), metaDe(k), pct(c, metaDe(k))]; })]);
  const cols = ['id', 'parte', 'nombre', 'celular', 'correo', 'invito', 'numeros', 'total', 'metodo', 'estado', 'fecha'];
  exp.ks.filter(k => exp.sel[k]).forEach(k => out.push([['BOLETOS ' + k.toUpperCase()], cols, ...act.filter(r => parte(r) === k).map(r => [r.id, k, r.nombre, r.pais, r.correo, r.invito || '', nums(r).join(' '), P(r), r.metodo || 'binance', estado(r), r.fecha])]));
  const solo = exp.ks.filter(k => exp.sel[k]), nombre = !exp.res && !exp.par && solo.length === 1 ? 'registros-' + solo[0] + '.csv' : 'rifa-' + new Date().toISOString().slice(0, 10) + '.csv';
  return { nombre, txt: out.map(sec => sec.map(ln).join('\n')).join('\n\n') };
}
function csvDescargar() {
  const { nombre, txt } = buildCSV(), a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + txt], { type: 'text/csv;charset=utf-8' })); a.download = nombre;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  cerrar(); toast('CSV exportado: ' + nombre);
}
